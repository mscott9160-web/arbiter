spring:
  datasource:
    url: jdbc:postgresql://${ARBITER_POSTGRES_HOST:127.0.0.1}:${ARBITER_POSTGRES_PORT:15432}/${ARBITER_POSTGRES_DB:arbiter}
    username: ${ARBITER_POSTGRES_USER:arbiter}
    password: ${ARBITER_POSTGRES_PASSWORD:arbiter_dev_only}

arbiter:
  classifier-url: ${ARBITER_CLASSIFIER_URL:http://127.0.0.1:8001}
  cache-ttl-seconds: ${ARBITER_CACHE_TTL_SECONDS:3600}
  semantic-threshold: ${ARBITER_SEMANTIC_THRESHOLD:0.95}
