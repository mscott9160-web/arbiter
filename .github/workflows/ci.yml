name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run gateway tests
        run: mvn -f gateway/pom.xml test -B
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install classifier requirements
        run: python -m pip install -r classifier-svc/requirements.txt
      - name: Run classifier tests
        run: python -m pytest classifier-svc/tests
      - name: Run smoke check
        run: python scripts/smoke.py